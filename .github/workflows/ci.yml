name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      # The @spore-host/truffle-ts dependency is a public git dependency; npm
      # normalizes its lockfile URL to git+ssh, which CI runners can't clone.
      # Rewrite git@github → https so `npm ci` fetches it over HTTPS.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:cov

      # The half of pin hygiene that needs the network, so it can't live in the
      # (hermetic) vitest suite: does each pin's `# vX.Y.Z` actually name the tag
      # its SHA carries? A wrong label is worse than none — it makes a
      # major-version jump read as a routine same-line bump, which is how a
      # checkout v6 -> v7.0.1 bump nearly landed in nf-spawn labelled `# v6`.
      # Read-only (git ls-remote), no auth.
      - name: Verify pin comments match their SHAs
        run: ./scripts/verify-pins.sh

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
