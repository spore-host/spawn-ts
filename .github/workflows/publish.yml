name: Publish to npm

# Publishes @spore-host/spawn-ts to the npm registry when a version tag is
# pushed (e.g. v0.6.0). Uses npm Trusted Publishing: publish is authorized by
# GitHub OIDC (id-token: write) scoped to this repo + workflow — no NPM_TOKEN,
# nothing to rotate. Provenance is attached automatically. Requires the trusted
# publisher to be registered on npmjs.com (org spore-host, repo spawn-ts,
# workflow publish.yml) and npm CLI >= 11.5.1 (installed below).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      # Every action below is pinned to a commit SHA, not a floating tag. This job
      # holds npm Trusted Publishing authority: `id-token: write` + OIDC lets
      # whatever runs here publish @spore-host/spawn-ts as us, and unlike a leaked
      # NPM_TOKEN there is nothing to rotate afterward. `@v4` means "whatever v4
      # points at when the job runs" — actions/checkout@v6 really did move
      # (df4cb1c → d23441a) with no signal to consumers. Dependabot bumps these
      # pins (see .github/dependabot.yml) so they stay current without being
      # mutable. (#72)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 22: npm's Trusted Publishing support needs a recent npm CLI, and
      # current npm releases require Node >= 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC-authorized publish) needs npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci

      # Publish the library artifacts only (dist/), matching package.json "files".
      - name: Build library
        run: npm run build:lib

      # Guard: every target in package.json "exports" must exist in dist/ (a missing
      # one means a broken import for consumers). Derived from "exports" itself, not
      # a list duplicated here — the hardcoded list this replaces never gained
      # "./transfer" when that subpath was added, so it had silently stopped
      # covering a real entry point.
      - name: Assert every declared export exists
        run: npm run check:exports

      # Existence is weaker than importability: ./terminal shipped in 0.6.0 and
      # 0.7.0 present-but-unimportable under plain Node (#70). This imports every
      # code subpath for real, and holds bundler-only ones to a declared reason.
      - name: Assert every subpath imports
        run: npm run check:imports

      # Guard: the pushed tag must match the package.json version, so a v0.6.0 tag
      # can't accidentally publish 0.5.0.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG" >&2; exit 1
          fi
          echo "tag and package version agree: $PKG"

      # No NODE_AUTH_TOKEN: OIDC (id-token: write) authorizes the publish, and
      # provenance is attached automatically under Trusted Publishing.
      - name: Publish
        run: npm publish --access public
